font_family JetBrainsMono Nerd Font
font_size 14
confirm_os_window_close 1

shell_integration enabled

# Workaround for old Intel GPUs (Ivy Bridge / HD 4000): create the window
# through GLX (XWayland) instead of EGL, which fails to init on this GPU.
linux_display_server x11

include matugen.conf

cursor_shape beam
cursor_blink_interval 0.5

background_opacity 0.75
window_padding_width 5
enabled_layouts splits

# Horizontal split (side-by-side or top/bottom depending on axis, or explicit below)
map ctrl+= launch --location=hsplit
# Vertical split
map ctrl+- launch --location=vsplit
